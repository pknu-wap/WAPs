name: AI Code Review with MiniMax

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    timeout-minutes: 10
    name: Review
    runs-on: ubuntu-latest
    steps:
      - name: Code Review
        uses: tarmojussila/minimax-code-review@v0.4.0
        with:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL: MiniMax-M3
          MINIMAX_SYSTEM_PROMPT: 당신은 전문 코드 리뷰어입니다. 풀 리퀘스트에서 변경 사항을 파악하고 코드와 같은 잠재적인 문제를 식별하세요. 스타일 위반, 논리적 오류, 보안 취약을 찾아내고 개선사항을 제공하세요. 문제점과 권고사항, 제안을 간결하게 명확히 나열하세요."
