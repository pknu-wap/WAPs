name: Deploy Swagger UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Public base URL embedded into the deployed OpenAPI spec.
  # Set as a repository or environment variable (Settings → Variables).
  PUBLIC_SERVER_URL: ${{ vars.PUBLIC_SERVER_URL }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swagger-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: server

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: waps
          MYSQL_USER: ${{ secrets.DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew bootJar -x test --no-daemon

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch swagger-ui-dist via npm
        run: |
          npm install swagger-ui-dist@5.29.5 --no-audit --no-fund
          mkdir -p site
          cp -r node_modules/swagger-ui-dist/. site/

      - name: Start Spring Boot server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # JWT_SECRET_KEY is generated per-run because /v3/api-docs is permitAll
          # and no real tokens are issued during CI spec extraction.
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.CI_KAKAO_REST_API_KEY }}
          SERVER_URL: ${{ vars.PUBLIC_SERVER_URL }}
          SWAGGER_SERVER_URL: ${{ vars.PUBLIC_SERVER_URL }}
          SPRING_PROFILES_ACTIVE: ""
        run: |
          nohup java -jar build/libs/server-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo "server pid=$!"
          for i in {1..60}; do
            sleep 2
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "server is up"
              exit 0
            fi
          done
          echo "server failed to start"
          tail -n 200 app.log
          exit 1

      - name: Fetch OpenAPI spec and patch initializer
        run: |
          curl -fsS http://localhost:8080/v3/api-docs -o site/openapi.json
          sed -i 's|https://petstore.swagger.io/v2/swagger.json|./openapi.json|g' site/swagger-initializer.js
          sed -i 's|https://petstore3.swagger.io/api/v3/openapi.json|./openapi.json|g' site/swagger-initializer.js

      - name: Show site contents
        run: ls -la site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: server/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
