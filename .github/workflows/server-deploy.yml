name: Server Deploy

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    environment: ${{ github.ref_name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=server-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=server-${{ github.ref_name }}

      - name: Deploy app over SSH
        timeout-minutes: 10
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          DEPLOY_ENV: ${{ github.ref_name }}
          APP_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
          OCI_BUCKET_NAME: ${{ secrets.OCI_BUCKET_NAME }}

        run: |
          set -euo pipefail

          deploy_vars=(DEPLOY_ENV APP_IMAGE GHCR_USER GHCR_TOKEN DB_NAME DB_USER DB_PASSWORD
            SERVER_URL JWT_SECRET_KEY KAKAO_REST_API_KEY KAKAO_CLIENT_SECRET SPRING_PROFILES_ACTIVE
            OCI_USER OCI_FINGERPRINT OCI_KEY OCI_TENANCY OCI_REGION OCI_NAMESPACE OCI_BUCKET_NAME)
          for name in OCI_HOST OCI_SSH_USER OCI_SSH_KNOWN_HOSTS "${deploy_vars[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required configuration: $name"
              exit 1
            fi
          done
          [[ "$DEPLOY_ENV" == main || "$DEPLOY_ENV" == production ]]
          [[ "$OCI_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$OCI_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]

          umask 077
          state=$(mktemp -d)
          trap 'rm -rf -- "$state"' EXIT
          printf '%s\n' "$OCI_KEY" > "$state/key"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$state/known_hosts"
          ssh_options=(-F /dev/null -i "$state/key" -p 22
            -o "UserKnownHostsFile=$state/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="$OCI_SSH_USER@$OCI_HOST"
          remote_dir="waps/$DEPLOY_ENV"

          # Copy only the app's Compose file; DB and Caddy are managed separately.
          # DEPLOY_ENV was restricted to main/production before building this path.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" \
            "mkdir -p '$remote_dir' && cat > '$remote_dir/docker-compose.yml'" < server/docker-compose.yml
          {
            for name in "${deploy_vars[@]}"; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat server/scripts/deploy.sh
          } | ssh "${ssh_options[@]}" "$target" 'bash -se'
